[tool.poetry]
name = "backend"
version = "0.1.0"
description = ""
authors = ["Vilius Gudziunas"]
package-mode = false

[tool.poetry.dependencies]
python = "~3.14"
fastapi = "~0.139.0"
pandas = "~3.0.3"
psycopg2-binary = "~2.9.12"
pydantic = "~2.13.4"
pydantic-settings = "~2.14.2"
python-multipart = "^0.0.32"
sqlalchemy = "~2.0.51"
uvicorn = "~0.51.0"

[tool.poetry.group.dev.dependencies]
alembic = "^1.18.5"
httpx = "^0.28.1"
pandas-stubs = "^3.0.3.260530"
pytest = "^9.1.1"
ruff = "^0.15.21"
ty = "^0.0.58"
types-psycopg2 = "^2.9.21.20260712"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.ty.rules]
missing-override-decorator = "error"
missing-type-argument = "error"


[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = [
    "AIR",   # Airflow
    "ERA",   # eradicate
    "FAST",  # FastAPI
    "YTT",   # flake8-2020
    "ANN",   # flake8-annotations
    "ASYNC", # flake8-async
    "S",     # flake8-bandit
    "BLE",   # flake8-blind-except
    "FBT",   # flake8-boolean-trap
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "COM",   # flake8-commas
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "T10",   # flake8-debugger
    "DJ",    # flake8-django
    "EM",    # flake8-errmsg
    "EXE",   # flake8-executable
    "FIX",   # flake8-fixme
    "FA",    # flake8-future-annotations
    "INT",   # flake8-gettext
    "ISC",   # flake8-implicit-str-concat
    "ICN",   # flake8-import-conventions
    "LOG",   # flake8-logging
    "G",     # flake8-logging-format
    "INP",   # flake8-no-pep420
    "PIE",   # flake8-pie
    "T20",   # flake8-print
    "PYI",   # flake8-pyi
    "PT",    # flake8-pytest-style
    "Q",     # flake8-quotes
    "RSE",   # flake8-raise
    "RET",   # flake8-return
    "SLF",   # flake8-self
    "SIM",   # flake8-simplify
    "SLOT",  # flake8-slots
    "TID",   # flake8-tidy-imports
    "TD",    # flake8-todos
    "TC",    # flake8-type-checking
    "ARG",   # flake8-unused-arguments
    "PTH",   # flake8-use-pathlib
    "FLY",   # flynt
    "I",     # isort
    "C90",   # mccabe
    "NPY",   # NumPy-specific rules
    "PD",    # pandas-vet
    "N",     # pep8-naming
    "PERF",  # Perflint
    "E",     # pycodestyle
    "W",     # pycodestyle
    "F",     # Pyflakes
    "PGH",   # pygrep-hooks
    "PL",    # Pylint
    "UP",    # pyupgrade
    "FURB",  # refurb
    "RUF",   # Ruff-specific rules
    "TRY",   # tryceratops

    # requires preview mode
    # "CPY",  # flake8-copyright
    # "DOC",  # pydoclint

    # not following the coding style
    # "D",   # pydocstyle
]
ignore = [
    "COM812", # missing-trailing-comma
    "TC001",  # typing-only-third-party-import
    "TC003",  # typing-only-third-party-import
]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = [
    "INP001", # implicit-namespace-package
]
"migrations/env.py" = [
    "E402", # module-import-not-at-top-of-file
]
"tests/*" = [
    "S101",    # assert
    "PLR2004", # magic-value-comparison
]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["pydantic.field_validator"]


[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (require database)",
]
